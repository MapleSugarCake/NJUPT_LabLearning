name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to test, used by the release workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
      - name: Install locked dependencies
        run: uv sync --locked --extra browser --group dev
      - name: Compile Python sources
        run: uv run --locked --extra browser --group dev python -m compileall -q main.py njupt_auth njupt_safetylabpass labpass_cli tests
      - name: Run offline tests
        run: uv run --locked --extra browser --group dev pytest
      - name: Ruff lint
        run: uv run --locked --extra browser --group dev ruff check .
      - name: Ruff format check
        run: uv run --locked --extra browser --group dev ruff format --check .
