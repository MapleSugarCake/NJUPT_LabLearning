[project]
name = "labpass"
version = "2.0.0"
description = "NJUPT laboratory safety course helper with bounded concurrency"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pycryptodome>=3.23.0",
    "requests>=2.32.5",
]

[project.scripts]
labpass = "labpass_cli.cli:entrypoint"

[project.optional-dependencies]
browser = ["playwright>=1.55.0"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]
build = [
    "pyinstaller>=6.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["njupt_auth", "njupt_safetylabpass", "labpass_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/njupt_auth", "/njupt_safetylabpass", "/labpass_cli", "/tests",
    "/main.py", "/main.spec", "/favicon.ico", "/README.md", "/AGENTS.md",
    "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = "build/pytest-cache"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
